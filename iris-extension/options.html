<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRIS Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options-shell">
      <header>
        <div class="iris-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" fill="none">
            <ellipse cx="44" cy="46" rx="30" ry="18" fill="url(#irisOptionsGradient)" />
            <circle cx="50" cy="48" r="20" fill="white" opacity="0.9" />
            <circle cx="50" cy="48" r="11" fill="url(#irisOptionsGradient)" />
            <line x1="64" y1="62" x2="78" y2="76" stroke="url(#irisOptionsGradient)" stroke-width="8" stroke-linecap="round" />
            <defs>
              <linearGradient id="irisOptionsGradient" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#5B21B6" />
                <stop offset="0.55" stop-color="#8B5CF6" />
                <stop offset="1" stop-color="#C4B5FD" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <h1>IRIS Options</h1>
          <p>Configure the Chrome extension frontend for backend testing.</p>
        </div>
      </header>

      <form id="options-form">
        <section class="settings-card">
          <label for="backend-url">Backend URL</label>
          <input id="backend-url" name="backend-url" type="url" placeholder="http://127.0.0.1:5000" required />
          <p>IRIS sends selected text to `/verify` and submitted images to `/verify-image` on this backend.</p>
        </section>

        <section class="settings-card">
          <label class="checkbox-row">
            <input id="panel-enabled" type="checkbox" />
            <span>Show floating panel automatically when text is selected</span>
          </label>
          <label class="checkbox-row">
            <input id="debug-mode" type="checkbox" />
            <span>Send debug=true to the backend during calibration</span>
          </label>
        </section>

        <section class="settings-grid">
          <label>
            Theme
            <select id="theme">
              <option value="system">Follow system</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>

          <label>
            Font size
            <select id="font-size">
              <option value="small">Small</option>
              <option value="default">Default</option>
              <option value="large">Large</option>
              <option value="xl">Extra Large</option>
            </select>
          </label>
        </section>

        <footer>
          <button type="submit">Save options</button>
          <button type="button" id="restore-defaults">Restore defaults</button>
        </footer>
      </form>

      <p id="save-status" role="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
